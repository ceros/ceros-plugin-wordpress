name: E2E (manual)

on:
  workflow_dispatch:
    inputs:
      ceros_env:
        description: Ceros dev environment to target (experience URLs + API host derive from it)
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (wp-env + real Ceros env)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # wp-env's dev port (also the suite default).
      BASE_URL: http://localhost:8888
      E2E_CEROS_ENV: ${{ inputs.ceros_env }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install and build the plugin
        run: |
          npm ci
          npm run build

      # Pin WordPress to the test-utils line (wp-6.9 -> 1.33.2); .wp-env.json leaves core unset.
      # A release zip downloads faster than a clone of WordPress/WordPress, and does not fail with `early EOF`.
      # Pin PHP to 8.2 here (bookworm base) rather than the committed 7.4 (bullseye),
      # whose base image's apt packages are archived and 404 during the image build.
      - name: Pin WordPress core and PHP for wp-env
        run: |
          echo '{ "core": "https://wordpress.org/wordpress-6.9.6.zip", "phpVersion": "8.2" }' > .wp-env.override.json

      # Runs in the background while the e2e dependencies and Chrome install.
      - name: Start wp-env
        run: |
          ( npm run env:start > "$RUNNER_TEMP/wp-env.log" 2>&1
            echo $? > "$RUNNER_TEMP/wp-env.exit" ) > /dev/null 2>&1 &

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chrome for Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chrome

      - name: Wait for wp-env
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/wp-env.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/wp-env.log"
          exit "$(cat "$RUNNER_TEMP/wp-env.exit")"

      - name: Configure the plugin for the Ceros env
        working-directory: tests/e2e
        env:
          E2E_CEROS_API_KEY: ${{ secrets.E2E_CEROS_API_KEY }}
        run: bash scripts/bootstrap-wp.sh

      - name: Run the suite
        working-directory: tests/e2e
        run: npm test -- --reporter=list,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
