name: E2E

# Not a required check. These tests need WordPress, Docker and a browser, so
# they are slower than the CI suite and deliberately kept separate from it.
on:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'includes/**'
      - 'src/**'
      - 'ceros.php'
      - 'package.json'
      - '.wp-env.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # wp-env's development port, from .wp-env.json. The suite derives
      # everything else from this.
      BASE_URL: http://localhost:8888
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      # build/ is gitignored and ceros.php requires build/ceros/render.php, so
      # an unbuilt tree is a fatal error rather than a test failure.
      - name: Build the plugin
        run: npm run build

      # The override file is gitignored, so CI writes its own. Two things go in
      # it. Core is pinned because .wp-env.json leaves it unset, which has
      # resolved to a version with no tag in the mirror.
      #
      # A placeholder API key is required, not optional: with no key configured
      # the block skips the fetch entirely and offers the paste-a-URL flow, so
      # the stub never fires and there is no error panel to assert on. The value
      # is irrelevant because the stub rejects by hostname, so this is a
      # deliberately invalid string rather than a secret.
      - name: Configure WordPress
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "core": "WordPress/WordPress#6.9.6",
            "config": { "CEROS_API_KEY": "e2e-placeholder-not-a-real-key" }
          }
          JSON
          cat .wp-env.override.json

      - name: Start WordPress
        run: npm run env:start

      - name: Install suite dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chrome
        working-directory: tests/e2e
        run: npx playwright install --with-deps chrome

      # Set explicitly rather than relying on the plugin's default, so the
      # error-panel assertions are deterministic. bootstrap-wp.sh reads it back.
      - name: Configure the plugin
        run: npx wp-env run cli wp option update ceros_api_environment production

      - name: Provision the suite
        working-directory: tests/e2e
        run: bash scripts/bootstrap-wp.sh

      - name: Stub the Ceros API
        working-directory: tests/e2e
        run: bash rig/mode.sh reject

      # The config selects the blob reporter under CI for sharded runs. This job
      # is a single shard, so ask for annotations and a readable report instead.
      - name: Run the specs
        working-directory: tests/e2e
        run: npx playwright test --reporter=github,html

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Show the WordPress log
        if: ${{ failure() }}
        run: npx wp-env run cli cat /var/www/html/wp-content/debug.log || true
