name: E2E checks

# Type-check + lint the e2e suite on PRs that touch it. Hermetic: no Docker,
# browser, network or secret — unlike the suite run in e2e-tests.yml.
on:
  pull_request:
    paths:
      - 'tests/e2e/**'

permissions:
  contents: read

concurrency:
  group: e2e-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint
