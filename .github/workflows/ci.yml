name: CI

# The .githooks/ gates are local-only and take --no-verify; this is the real one.
on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP lint & compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 7.4 is the declared floor and phpcs.xml's testVersion.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # --strict also checks composer.lock is in sync with composer.json.
      - name: Validate composer.json and lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        run: composer lint

  php-tests:
    name: PHP unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same floor as the lint job. The suite needs no WordPress, database or
      # network, so there is nothing else to provision.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: composer test

  js-lint:
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Stylelint
        run: npm run lint:css

  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

  shell-tests:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Needs only bash, curl and jq, all present on the runner. The version
      # API is stubbed on PATH, so this makes no network request.
      - name: Run shell tests
        run: bash tests/shell/check-tested-upto.test.sh

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # build/ is committed and shipped, so an unrebuilt src/ change ships stale assets.
      - name: Verify committed build/ matches src/
        run: git diff --exit-code -- build/

  plugin-check:
    name: WordPress plugin check
    runs-on: ubuntu-latest
    # Scoped to this job: the action posts its findings as a PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Check what ships: dev files plugin-zip already excludes would otherwise fail.
      - name: Build the distributable
        run: |
          npm ci
          npm run build
          npm run plugin-zip
          unzip -q ceros.zip -d dist

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/ceros
          # Otherwise the slug comes from the repo name and every 'ceros' domain mismatches.
          slug: ceros
          # Goes stale on WordPress releases, not repo changes; bump it in release prep.
          ignore-codes: outdated_tested_upto_header
