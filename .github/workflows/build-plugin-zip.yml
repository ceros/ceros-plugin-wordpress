name: Build Plugin ZIP

# Builds the Ceros plugin ZIP.
#
# A version tag (e.g. v0.32.0) publishes it as a GitHub Release. A manual run
# from the Actions tab builds the same ZIP and leaves it as a workflow artifact
# without publishing, for handing someone a build before a release exists.
#
# The version comes from package.json, and a tag has to match it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ahead of the install so a mismatched tree fails in seconds. Neither is
      # conditional: a release with disagreeing declarations or an undated
      # changelog entry cannot be identified afterwards.
      - name: Check the version declarations agree
        run: bash tools/check-versions.sh

      - name: Check the changelog entry and heading order
        run: bash tools/check-changelog.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin ZIP
        run: npm run plugin-zip

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="${{ steps.version.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Rename ZIP with version
        run: mv ceros.zip "ceros-wordpress-plugin-${{ steps.version.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceros-wordpress-plugin-${{ steps.version.outputs.version }}
          path: ceros-wordpress-plugin-${{ steps.version.outputs.version }}.zip

      # Only a tag push publishes, and the condition says so rather than testing
      # ref_type: a manual run can be dispatched against a tag, which would
      # otherwise republish over an existing release. A manual run stops at the
      # artifact above.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ceros-wordpress-plugin-${{ steps.version.outputs.version }}.zip
