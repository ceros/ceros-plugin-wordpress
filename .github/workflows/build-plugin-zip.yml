name: Build Plugin ZIP

# Builds the Ceros plugin ZIP and publishes it as a GitHub Release.
#
# Runs automatically when a version tag (e.g. v0.31.0) is pushed, and can be
# triggered manually from the Actions tab. On a manual run the version is read
# from package.json; enable "prerelease" to mark the release as a pre-release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin ZIP
        run: npm run plugin-zip

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="${{ steps.version.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Rename ZIP with version
        run: mv ceros.zip "ceros-${{ steps.version.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceros-${{ steps.version.outputs.version }}
          path: ceros-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: ceros-${{ steps.version.outputs.version }}.zip
